<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signing in&hellip;</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050b12;
        color: #eafaf8;
        font: 14px/1.5 system-ui, sans-serif;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <p id="status">Signing you in&hellip;</p>
    <script>
      // This page only ever runs inside the popup window that script.js opens.
      // Google redirects back here with the result in the URL fragment; we hand
      // it to the page that opened us and then close ourselves.
      (function () {
        var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var message = {
          source: "prism-google-auth",
          state: params.get("state"),
          accessToken: params.get("access_token") || null,
          error: params.get("error") || null
        };

        if (!window.opener) {
          document.getElementById("status").textContent =
            "Sign-in finished. You can close this window.";
          return;
        }

        // A file:// opener (the desktop app) has an opaque "null" origin, which
        // postMessage only accepts as the literal target "*".
        var targetOrigin = window.location.origin !== "null" ? window.location.origin : "*";

        window.opener.postMessage(message, targetOrigin);
        window.close();
      })();
    </script>
  </body>
</html>
