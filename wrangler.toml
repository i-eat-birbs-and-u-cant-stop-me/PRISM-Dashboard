name = "prism-layout-ai"
main = "workers/layout-ai.mjs"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://i-eat-birbs-and-u-cant-stop-me.github.io"
GROQ_MODEL = "openai/gpt-oss-120b"
TEACHER_DASHBOARD_URL = "https://i-eat-birbs-and-u-cant-stop-me.github.io/PRISM-Dashboard/"

[[d1_databases]]
binding = "TEACHER_DB"
database_name = "prism-teacher-permissions"
database_id = "9f8254f4-177f-4dc8-b203-b0ccb4ccdd81"
migrations_dir = "migrations"

[[ratelimits]]
name = "LAYOUT_AI_LIMITER"
namespace_id = "749311"

  [ratelimits.simple]
  limit = 12
  period = 60
